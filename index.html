<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Time Bubble Sand</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div id="hud">
        <span id="fps">FPS: —</span>
        <span id="bubble-info">R: 35</span>
      </div>
      <div id="radius-controls">
        <button type="button" id="radius-minus" aria-label="Уменьшить радиус">−</button>
        <input type="range" id="bubble-radius" min="15" max="60" value="35" aria-label="Радиус пузыря" />
        <button type="button" id="radius-plus" aria-label="Увеличить радиус">+</button>
      </div>
    </div>

    <div id="palette" aria-label="Материалы"></div>

    <div id="stage">
      <canvas id="game" width="320" height="180"></canvas>
      <div id="joystick" aria-label="Джойстик движения">
        <div id="joystick-thumb"></div>
      </div>
    </div>

    <p id="hint">WASD — движение · ЛКМ — рисовать · [ ] — радиус · 1–6 — материал</p>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
